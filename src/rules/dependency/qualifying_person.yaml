      operator: eq
      value: true
    - node: child_marital_status_on_1231
      operator: eq
      value: married
    - node: child_is_dependent
      operator: eq
      value: true
  actions:
    type: set
    value: true
  citations:
    - IRS_PUB_501_QUALIFYING_PERSON: https://www.irs.gov/pubs/p501

- rule_id: qualifying_person_child_married_not_dependent
  rule_type: decision
