# Pub 501: https://www.irs.gov/pubs/p501 - Table 4
# Qualifying Person
- rule_id: qualifying_person_child_single
  rule_type: decision
  target: qualifying_person_hoh_status
  conditions:
    - node: qualifying_person_lived_with_taxpayer_more_than_half_of_year
      operator: eq
      value: true
    - node: child_marital_status_on_1231
      operator: eq
      value: single
  actions:
    type: set
    value: true
  citations:
    - IRS_PUB_501_QUALIFYING_PERSON: https://www.irs.gov/pubs/p501

- rule_id: qualifying_person_child_married_dependent
  rule_type: decision
  target: qualifying_person_hoh_status
