# Pub 501: https://www.irs.gov/pubs/p501 - Standard Deduction
# May claim standard deduction when eligible
- rule_id: standard_deduction_eligible_single
  rule_type: decision
  target: may_claim_standard_deduction
  conditions:
    - node: valid_filing_statuses
      operator: contains
      value: single
    - node: did_not_itemize
      operator: eq
      value: true
  actions:
    type: set
    value: true
  citations:
    - IRS_PUB_501: https://www.irs.gov/pubs/p501

