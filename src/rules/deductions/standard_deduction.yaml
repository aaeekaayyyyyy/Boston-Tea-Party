# Additional amount for age 65 or blind
- rule_id: standard_deduction_additional_65_or_blind
  rule_type: decision
  target: standard_deduction_additional_amount_eligible
  conditions_any:
    - node: taxpayer_age_65_or_older
      operator: eq
      value: true
    - node: taxpayer_blind
      operator: eq
      value: true
    - node: spouse_age_65_or_older
      operator: eq
      value: true
    - node: spouse_blind
      operator: eq
      value: true
  actions:
    type: set
    value: true
  citations:
    - IRS_PUB_501: https://www.irs.gov/pubs/p501
